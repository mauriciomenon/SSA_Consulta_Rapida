# mypy baseline (placeholder) – nao habilitado em CI ainda.
# Estrategia incremental sugerida:
#  1. Executar: mypy --ignore-missing-imports --install-types --non-interactive .
#  2. Corrigir erros em modulos core/ e armazenamento/ primeiro.
#  3. Introduzir strictness gradual via per-module overrides.
#  4. Adicionar etapa em CI somente apos <30 erros totais.

[mypy]
python_version = 3.13
warn_unused_configs = True
ignore_missing_imports = True   # Reduz ruido inicial
warn_redundant_casts = True
warn_unused_ignores = True
show_error_codes = True
# plugins =

# Excluir diretorios volumosos ou gerados
exclude = (docs|docs_saida|legacy|data|exportacao|extracao|logs|reports|launchers/dist_simple|tests/legacy_tests)

# Exemplo futuro (quando removido ignore_missing_imports):
# [mypy-pandas.*]
# ignore_missing_imports = True  # ate estabilizar tipagens externas
