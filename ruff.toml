# Ruff configuracao baseline.
# Objetivo historico: silencio total (ignore=ALL) para evitar ruido durante refatoracoes.
# Plano incremental sugerido:
#   1. Remover IGNORE TOTAL e habilitar 'E','F' (erros/falhas) em uma branch dedicada.
#   2. Adicionar grupos: 'UP' (modernizacao), 'SIM' (simplificacoes), 'I' (imports) conforme removemos falsos positivos.
#   3. Promover warnings criticos a falhas em CI apos estabilizacao.
#   4. Desligar regras especificas via per-file-ignores em vez de ignorar ALL.
#
# Enquanto isso, mantemos ignorado para nao introduzir ruido inesperado.

line-length = 100
# Exclui grandes diretorios de dados e caches
exclude = [
  "docs","reports","launchers/dist_simple","tests/legacy_tests","data","exportacao",
  "docs_saida","legacy",".venv","__pycache__","extracao","logs"
]

[lint]
select = ["E","F"]
ignore = []

# Evita qualquer alteracao de formatacao automatica se alguem rodar 'ruff format'
[format]
quote-style = "preserve"
indent-style = "space"
