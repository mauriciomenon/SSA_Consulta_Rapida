repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: ["--maxkb=10240"]  # 10 MB alerta precoce
      - id: check-merge-conflict
      - id: mixed-line-ending
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3
  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        additional_dependencies: ["flake8==6.1.0"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: ["types-requests"]
        args: ["--ignore-missing-imports", "--scripts-are-modules", "core", "utils", "scripts"]
  - repo: https://github.com/asottile/yesqa
    rev: v1.5.0
    hooks:
      - id: yesqa
  - repo: https://github.com/asottile/reorder_python_imports
    rev: v3.12.0
    hooks:
      - id: reorder-python-imports
        args: ["--application-directories=.:core:utils:scripts", "--py3-plus"]

  - repo: local
    hooks:
      - id: banned-tokens-scan
        name: Banned tokens scan (governance)
        entry: python scripts_manutencao/check_banned_tokens.py
        language: system
        pass_filenames: false
        stages: [commit]
        types: [text]
        additional_dependencies: []

ci:
  autofix_prs: false
  autofix_commit_msg: "style: auto-fixes via pre-commit"
  skip: [ruff]  # Ajustar conforme necessidade
