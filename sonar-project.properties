sonar.projectKey=mauriciomenon_SSA_Consulta_Rapida
sonar.organization=mauriciomenon
sonar.host.url=https://sonarcloud.io

sonar.sources=armazenamento,config,core,exportacao,extracao,gui,interface,shared,utils,scripts
sonar.exclusions=**/tests/**,**/test_*.py,**/__pycache__/**,build/**,builds/**,dist/**,dist_packages/**

sonar.python.version=3.12

# Limites de qualidade (Quality Gate)
sonar.qualitygate.wait=true

# Severidade minima para falhar (INFO, MINOR, MAJOR, CRITICAL, BLOCKER)
sonar.issue.enforce.severity=MAJOR

# Ignora testes e builds
sonar.coverage.exclusions=**/tests/**,build/**,builds/**
