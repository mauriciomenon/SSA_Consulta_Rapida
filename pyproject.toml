[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[project]
name = "ssa-consulta-rapida"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "openpyxl",
    "pyqt6",
    "numpy",
    "tabulate",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "flake8",
    "pytest",
    "ty",
    "black",
]
build = [
    "pyinstaller",
    "nuitka",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--ignore=tests/test_db_load.py --ignore=tests/test_import_analysis.py"
markers = [
  "performance: performance tests",
  "integration: integration tests",
  "smoke: smoke tests",
  "stress: stress tests",
]
