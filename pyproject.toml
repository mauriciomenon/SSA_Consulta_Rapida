[build-system]
requires = ["setuptools>=83.0.0,<84"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = ["--ignore=tests/legacy_tests"]
markers = [
  "performance: performance tests",
  "integration: integration tests",
  "legacy: legacy tests",
  "slow: slow tests",
  "smoke: smoke tests",
  "stress: stress tests",
]

[project]
name = "ssa-consulta-rapida"
version = "4.50.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.3.3,<3; python_version < '3.11'",
    "pandas>=3.0.5,<4; python_version >= '3.11'",
    "openpyxl>=3.1.5,<4",
    "defusedxml>=0.7.1,<1",
    "lxml>=6.1.3,<7",
    "pyqt6>=6.11.0,<7",
    "numpy>=2.2.6,<2.3; python_version < '3.11'",
    "numpy>=2.4.6,<2.5; python_version == '3.11'",
    "numpy>=2.5.3,<3; python_version >= '3.12'",
    "tabulate>=0.10.0,<1",
    "filelock>=3.32.6,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-timeout>=2.4.0,<3",
    "flake8>=7.3.0,<8",
    "black>=26.5.1,<27",
    "mypy>=2.3.1,<3",
    "pytest-cov>=7.1.0,<8",
    "pre-commit>=4.6.2,<5",
    "ruff>=0.16.6,<1",
    "ty>=0.0.79,<1",
    "pillow>=12.3.0,<13",
]
build = [
    "pyinstaller>=6.22.2,<7",
    "nuitka>=4.2.1,<5",
    "pillow>=12.3.0,<13",
    "cairosvg>=2.9.1,<3",
    "pywin32>=312,<313; platform_system == 'Windows'",
    "patchelf>=0.19.1.0,<1; platform_system == 'Linux'",
]
web = [
    "streamlit>=1.63.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-timeout>=2.4.0,<3",
    "flake8>=7.3.0,<8",
    "black>=26.5.1,<27",
    "mypy>=2.3.1,<3",
    "pytest-cov>=7.1.0,<8",
    "pre-commit>=4.6.2,<5",
    "ruff>=0.16.6,<1",
    "ty>=0.0.79,<1",
    "pillow>=12.3.0,<13",
]

[tool.uv]
constraint-dependencies = [
    "idna>=3.19,<4",
    "virtualenv>=21.7.9,<22",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
