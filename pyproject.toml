[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
markers = [
  "performance: performance tests",
  "integration: integration tests",
  "legacy: legacy tests",
  "slow: slow tests",
  "smoke: smoke tests",
  "stress: stress tests",
]

[project]
name = "ssa-consulta-rapida"
version = "4.51.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3.3,<3; python_version < '3.11'",
    "pandas>=3.0.5,<4; python_version >= '3.11'",
    "openpyxl>=3.1.5,<4",
    "defusedxml>=0.7.1,<1",
    "lxml>=6.1.3,<7",
    "pyqt6>=6.11.0,<7",
    "numpy>=2.2.6,<2.3; python_version < '3.11'",
    "numpy>=2.4.6,<2.5; python_version == '3.11'",
    "numpy>=2.5.3,<3; python_version >= '3.12'",
    "tabulate>=0.10.0,<1",
    "filelock>=4.2.1,<5",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.22.2,<7",
    "nuitka>=4.2.1,<5",
    "pillow>=13.0.0,<14",
    "cairosvg>=2.9.1,<3",
    "pywin32>=312,<313; platform_system == 'Windows'",
    "patchelf>=0.19.1.0,<1; platform_system == 'Linux'",
]
web = [
    "streamlit>=1.63.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-timeout>=2.4.0,<3",
    "flake8>=7.3.0,<8",
    "black>=26.5.1,<27",
    "mypy>=2.3.1,<3",
    "pytest-cov>=7.1.0,<8",
    "pre-commit>=4.6.2,<5",
    "ruff>=0.16.6,<1",
    "ty>=0.0.79,<1",
    "pillow>=13.0.0,<14",
]

[tool.uv]
# Carencia: nao resolver versoes publicadas ha menos de 7 dias (janela de release comprometida).
exclude-newer = "7 days"
# Excecoes verificadas em 24/10 (OSV limpo e provenance do PyPI do repositorio oficial),
# so para correcao de seguranca: streamlit 1.66.1 (primeira que aceita pillow 13, que corrige
# 41 avisos), certifi 2026.10.19 (aviso critico) e virtualenv 21.14.13 (aviso alto).
# setuptools 84.2.1 (25/10, pedido do dono): corrige GHSA-xmj3-9gf7-h52w (baixo), OSV limpo. O
# projeto nunca publica attestation no PyPI (nem a 84.0.0 anterior); origem conferida pela release
# v84.2.1 de pypa/setuptools criada por github-actions[bot] 6 s apos o upload, CI verde no commit.
exclude-newer-package = { streamlit = "2026-10-22T00:00:00Z", certifi = "2026-10-21T00:00:00Z", virtualenv = "2026-10-23T00:00:00Z", setuptools = "2026-10-21T00:00:00Z" }
constraint-dependencies = [
    "idna>=3.19,<4",
    "virtualenv>=21.7.9,<22",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
