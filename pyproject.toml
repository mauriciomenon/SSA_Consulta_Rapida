[project]
name = "ssa-consulta-rapida"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pandas",
    "openpyxl",
    "ruff",
    "pyqt6",
    "flake8",
    "pytest",
    "ty",
    "numpy",
    "scipy",
    "tabulate",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--ignore=tests/test_db_load.py --ignore=tests/test_import_analysis.py"
