# Configuracao padrao SonarCloud para projetos Python
# Copie para raiz do projeto e ajuste projectKey

sonar.organization=mauriciomenon
sonar.host.url=https://sonarcloud.io

# Ajustar por projeto
sonar.projectKey=mauriciomenon_NOME_DO_PROJETO
sonar.sources=src

# Exclusoes comuns
sonar.exclusions=**/tests/**,**/test_*.py,**/__pycache__/**,build/**,dist/**

# Python version
sonar.python.version=3.12

# Quality Gate
sonar.qualitygate.wait=true
sonar.issue.enforce.severity=MAJOR

# Coverage
sonar.coverage.exclusions=**/tests/**,build/**
