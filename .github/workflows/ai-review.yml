name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    name: AI PR Review (optional)
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.draft == false }}
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install -U pip
          python -m pip install requests ripgrep
      - name: Generate AI review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          QWEN_MODEL: ${{ vars.QWEN_MODEL }}
          QWEN_ENDPOINT: ${{ vars.QWEN_ENDPOINT }}
          FORCE_PROVIDER: ${{ vars.FORCE_PROVIDER }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python .github/scripts/ai_review.py | tee /tmp/ai_review.log
      - name: Comment on PR
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '.github/scripts/review.md';
            let body = '';
            try { body = fs.readFileSync(path, 'utf8'); } catch (e) { body = 'AI review não gerado.'; }
            const header = '## 🤖 AI Review\n';
            const comment = header + '\n' + body.substring(0, 50000);
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });

