# StackHawk DAST requires a configured application target and HAWK_API_KEY.
# This workflow is manual-only until the repository has a stable service start script.
name: "StackHawk"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stackhawk:
    permissions:
      contents: read
      security-events: write
    name: StackHawk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate StackHawk configuration
        shell: bash
        env:
          TARGET_URL: ${{ vars.STACKHAWK_TARGET_URL }}
        run: |
          if [[ ! -f stackhawk.yml ]]; then
            echo "::error::stackhawk.yml is required before running StackHawk."
            exit 1
          fi
          if [[ ! -f scripts/start_stackhawk_target.sh ]]; then
            echo "::error::scripts/start_stackhawk_target.sh must exist."
            exit 1
          fi
          if [[ -z "$TARGET_URL" ]]; then
            echo "::error::STACKHAWK_TARGET_URL repository variable is required."
            exit 1
          fi

      - name: Start scan target
        shell: bash
        run: bash scripts/start_stackhawk_target.sh &

      - name: Wait for scan target
        shell: bash
        env:
          TARGET_URL: ${{ vars.STACKHAWK_TARGET_URL }}
        run: |
          for _ in {1..30}; do
            if curl --fail --silent --show-error --max-time 2 "$TARGET_URL" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::StackHawk target did not become ready: $TARGET_URL"
          exit 1

      - name: Run HawkScan
        uses: stackhawk/hawkscan-action@4c3258cd62248dac6d9fe91dd8d45928c697dee0
        continue-on-error: true
        with:
          apiKey: ${{ secrets.HAWK_API_KEY }}
          codeScanningAlerts: true
          githubToken: ${{ github.token }}
