# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow file requires a free account on Semgrep.dev to
# manage rules, file ignores, notifications, and more.
#
# See https://semgrep.dev/docs

name: Semgrep

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main", "dev" ]
  schedule:
    - cron: '34 9 * * 1'

permissions:
  contents: read

jobs:
  semgrep:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      # Checkout project source
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Decide Semgrep mode
        id: semgrep_mode
        shell: bash
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          SEMGREP_DEPLOYMENT_ID: ${{ secrets.SEMGREP_DEPLOYMENT_ID }}
        run: |
          is_fork_pr="${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.fork || false) }}"
          can_publish="true"
          if [[ "$is_fork_pr" == "true" ]]; then
            can_publish="false"
          fi

          if [[ -n "$SEMGREP_APP_TOKEN" && -n "$SEMGREP_DEPLOYMENT_ID" && "$can_publish" == "true" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Scan and publish when deployment secrets are available and PR is not from fork
      - uses: returntocorp/semgrep-action@fcd5ab7459e8d91cb1777481980d1b18b4fc6735
        if: steps.semgrep_mode.outputs.publish == 'true'
        with:
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          publishDeployment: ${{ secrets.SEMGREP_DEPLOYMENT_ID }}
          generateSarif: "1"

      # Run non-publishing scan for fork PRs or when deployment secrets are unavailable
      - uses: returntocorp/semgrep-action@fcd5ab7459e8d91cb1777481980d1b18b4fc6735
        if: steps.semgrep_mode.outputs.publish != 'true'
        with:
          # p/ci keeps baseline Semgrep checks active when publish settings are unavailable.
          config: p/ci
          generateSarif: "1"

      # Upload SARIF file generated in previous step
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@3c0d63e66e68ee1e3e7c41f58dc6f94e6db0cbb5 # v3.28.6
        with:
          sarif_file: semgrep.sarif
        if: always()
