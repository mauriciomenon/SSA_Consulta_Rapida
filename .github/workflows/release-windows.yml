name: release-windows

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/release-windows.yml"
  workflow_dispatch:
    inputs:
      backend:
        description: "Backend Windows"
        required: true
        default: "nuitka"
        type: choice
        options:
          - nuitka
          - pyinstaller
          - pyoxidizer
      skip_installer:
        description: "Gerar somente ZIP, sem instalador Inno"
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RELEASE_BACKEND: ${{ inputs.backend || 'nuitka' }}
      RELEASE_INSTALLER_REQUIRED: ${{ !inputs.skip_installer }}
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install Inno Setup
        if: ${{ env.RELEASE_INSTALLER_REQUIRED == 'true' }}
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          $ErrorActionPreference = "Stop"
          choco install innosetup --no-progress -y
          Get-Command iscc | Format-List Source, Version

      - name: Run Windows release
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          $ErrorActionPreference = "Stop"
          $backend = $env:RELEASE_BACKEND
          if ([string]::IsNullOrWhiteSpace($backend)) {
            $backend = "nuitka"
          }
          $releaseParams = @{
            Target = "windows"
            Backend = @($backend)
            Yes = $true
          }
          if ($env:RELEASE_INSTALLER_REQUIRED -ne "true") {
            $releaseParams.SkipInstaller = $true
          }
          & .\release.ps1 @releaseParams

      - name: Upload Windows release logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-logs-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            launchers/logs/*.log
            builds/reports/*.json

      - name: Assert Windows artifacts
        shell: pwsh
        run: |
          Set-StrictMode -Version 3.0
          $ErrorActionPreference = "Stop"
          $report = "builds\reports\release_report_windows_amd64.json"
          if (-not (Test-Path -LiteralPath $report -PathType Leaf)) {
            throw "Relatorio Windows ausente: $report"
          }
          $zipFiles = @(Get-ChildItem -LiteralPath "builds\packages\windows_amd64" -Filter "*.zip" -File -ErrorAction SilentlyContinue)
          if ($zipFiles.Count -eq 0) {
            throw "ZIP Windows ausente em builds\packages\windows_amd64"
          }
          if ($env:RELEASE_INSTALLER_REQUIRED -eq "true") {
            $installerFiles = @(Get-ChildItem -LiteralPath "dist_packages" -Filter "*.exe" -File -ErrorAction SilentlyContinue)
            if ($installerFiles.Count -eq 0) {
              throw "Instalador Windows ausente em dist_packages"
            }
          }
          Get-Content -LiteralPath $report -Raw

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-${{ env.RELEASE_BACKEND }}
          if-no-files-found: error
          path: |
            builds/packages/windows_amd64/*.zip
            builds/reports/release_report_windows_amd64.json
            dist_packages/*.exe
            dist_packages/installer_*.iss
