name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff/black/mypy/bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install linters
        run: |
          python -m pip install -U pip
          python -m pip install ruff==0.6.9 black==24.8.0 mypy==1.11.1 bandit==1.7.9
      - name: Ruff
        run: ruff check .
      - name: Black (check)
        run: black --check .
      - name: Mypy (if config present)
        run: |
          if [ -f mypy.ini ] || rg -n "\[tool.mypy\]" pyproject.toml >/dev/null 2>&1; then \
            mypy .; \
          else \
            echo "Skipping mypy (no config)"; \
          fi
      - name: Bandit (security scan)
        run: bandit -q -r . || true

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          # Optional test tooling if present
          python -m pip install pytest pytest-cov || true
      - name: Run tests
        env:
          PYTHONWARNINGS: ignore
        run: |
          pytest -q || pytest -q -k ""  # always attempt tests; do not fail hard in absence

