name: CI (Minimal)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e . || true
          pip install pytest

      - name: Governance scan
        run: python scripts_manutencao/check_banned_tokens.py

      # Lint desativado (Ruff removido a pedido). Mantido placeholder se precisar reativar.
      - name: Lint (desativado)
        run: echo "Ruff desativado neste workflow."

      - name: Run fast tests
        run: pytest -q

      - name: Summary note
        run: |
          echo "Modo mínimo: cobertura e black check desativados para reduzir ruído." \
           && echo "Reativar etapas completas quando estabilizar (coverage, black --check, matrix)."
