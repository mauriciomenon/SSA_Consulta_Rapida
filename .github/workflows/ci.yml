name: CI (Minimal)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install minimal dependencies
        run: |
          sudo apt-get update
            sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-cursor0 libdbus-1-3 x11-utils
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e . || true
          pip install pytest

      - name: Governance scan
        run: python scripts_manutencao/check_banned_tokens.py
        continue-on-error: true

      # Lint desativado (Ruff removido a pedido). Mantido placeholder se precisar reativar.
      - name: Lint (desativado)
        run: echo "Ruff desativado neste workflow."

      - name: Run fast tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q --ignore=tests/gui_poc_smoke_test.py --ignore=tests/test_gui_filter_logic.py --ignore=tests/test_gui_stability.py

      - name: Summary note
        run: |
          echo "Modo mínimo: cobertura e black check desativados para reduzir ruído." \
           && echo "Reativar etapas completas quando estabilizar (coverage, black --check, matrix)."
