name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Lint (ruff/black/mypy/bandit)
    runs-on: ubuntu-latest
    if: ${{ vars.CI_ENABLE_LINT != 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install linters
        run: |
          python -m pip install -U pip
          python -m pip install ruff==0.6.9 black==24.8.0 mypy==1.11.1 bandit==1.7.9
      - name: Ruff
        run: |
          # Use STRICT mode if you want lint to fail the job
          if [ "${{ vars.CI_STRICT_LINT }}" = "true" ]; then
            ruff check .
          else
            ruff check . --exit-zero
          fi
      - name: Black (check)
        run: |
          if [ "${{ vars.CI_STRICT_LINT }}" = "true" ]; then
            black --check .
          else
            black --check . || true
          fi
      - name: Mypy (if config present)
        run: |
          if [ -f mypy.ini ] || rg -n "\[tool.mypy\]" pyproject.toml >/dev/null 2>&1; then \
            mypy .; \
          else \
            echo "Skipping mypy (no config)"; \
          fi
      - name: Bandit (security scan)
        run: bandit -q -r . || true

  tests:
    name: Pytest
    runs-on: ubuntu-latest
    if: ${{ vars.CI_ENABLE_TESTS != 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          # Optional test tooling if present
          python -m pip install pytest pytest-cov || true
      - name: Run tests (quick subset by default)
        env:
          PYTHONWARNINGS: ignore
        run: |
          set -e
          # Allow overriding via repo variables
          FILES="${{ vars.CI_PYTEST_FILES }}"
          MARK_EXPR="${{ vars.CI_PYTEST_MARK }}"
          if [ -n "$FILES" ]; then
            echo "Running pytest on files: $FILES"
            pytest -q $FILES
          elif [ -n "$MARK_EXPR" ]; then
            echo "Running pytest with mark expression: $MARK_EXPR"
            pytest -q -m "$MARK_EXPR"
          else
            # Default quick subset to avoid heavy integration/gui/perf tests
            pytest -q \
              tests/test_default_filter_mode.py \
              tests/test_filter_modes.py \
              tests/test_ssa_normalization_db.py \
              tests/test_table_printer.py \
              tests/test_file_metadata.py \
              tests/test_caching.py \
              tests/test_docs_and_priority.py
