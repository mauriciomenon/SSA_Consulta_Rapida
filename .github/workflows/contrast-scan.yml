# Contrast Scan requires a prebuilt artifact and Contrast account secrets.
# This workflow is manual-only until the release artifact path is stable.
name: Contrast Scan

on:
  workflow_dispatch:
    inputs:
      artifact_path:
        description: "Path to the built artifact to scan"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-scan:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate artifact path
        shell: bash
        env:
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
        run: |
          if [[ ! -f "$ARTIFACT_PATH" ]]; then
            echo "::error::Artifact path does not exist: $ARTIFACT_PATH"
            exit 1
          fi

      - name: Contrast Scan Action
        uses: Contrast-Security-OSS/contrastscan-action@7352a45d9678ec8a434cf061b07ffb51c1e351a1
        with:
          artifact: ${{ inputs.artifact_path }}
          apiKey: ${{ secrets.CONTRAST_API_KEY }}
          orgId: ${{ secrets.CONTRAST_ORGANIZATION_ID }}
          authHeader: ${{ secrets.CONTRAST_AUTH_HEADER }}

      - name: Upload SARIF file
        if: hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
