# Snyk container scanning requires a Dockerfile and SNYK_TOKEN.
# The workflow skips with a notice when the repository has no Dockerfile.
name: Snyk Container

on:
  push:
    branches: ["main", "dev", "protection_pattern_menon"]
  schedule:
    - cron: '23 14 * * 0'

permissions:
  contents: read

jobs:
  snyk:
    permissions:
      contents: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Dockerfile
        id: dockerfile_check
        shell: bash
        run: |
          if [[ -f Dockerfile ]]; then
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Dockerfile not found; skipping Snyk container scan."
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        if: steps.dockerfile_check.outputs.has_dockerfile == 'true'
        run: docker build -t ssa-consulta-rapida:security-scan .

      - name: Run Snyk to check Docker image for vulnerabilities
        if: steps.dockerfile_check.outputs.has_dockerfile == 'true'
        continue-on-error: true
        uses: snyk/actions/docker@14818c4695ecc4045f33c9cee9e795a788711ca4
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ssa-consulta-rapida:security-scan
          args: --file=Dockerfile

      - name: Upload result to GitHub Code Scanning
        if: hashFiles('snyk.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
