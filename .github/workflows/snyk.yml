name: Snyk Security

# Disabled until SNYK_TOKEN is configured in repository secrets
# To enable: Settings > Secrets and variables > Actions > New repository secret
on:
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run Snyk (optional - requires SNYK_TOKEN secret)
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --org=1c43a760-bde3-4178-b0ef-2885be92ce3d
