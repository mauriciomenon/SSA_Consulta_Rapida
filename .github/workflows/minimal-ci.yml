name: minimal-ci

on:
  push:
    branches: [main, dev]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/minimal-ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/minimal-ci.yml"

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dev dependencies
        run: |
          set -euo pipefail
          uv sync --extra dev

      - name: Py compile critical paths
        run: |
          set -euo pipefail
          python -m py_compile \
            interface/cli_enhancement_manager.py \
            core/app_logic.py \
            armazenamento/database_optimized.py \
            gui/ssa/gui_filters_advanced_logic.py \
            dev_env/streamlit_app.py

      - name: Ruff
        run: |
          set -euo pipefail
          uv run ruff check \
            interface/cli_enhancement_manager.py \
            core/app_logic.py \
            armazenamento/database_optimized.py \
            gui/ssa/gui_filters_advanced_logic.py \
            dev_env/streamlit_app.py \
            tests/test_cli_enhancement_manager_lock_usage.py \
            tests/test_import_cancellation.py \
            tests/test_database_optimized_identifier_guards.py \
            tests/test_gui_filters_advanced_logic.py \
            tests/test_streamlit_filter_cache.py

      - name: Ty
        run: |
          set -euo pipefail
          uv run ty check \
            interface/cli_enhancement_manager.py \
            core/app_logic.py \
            armazenamento/database_optimized.py \
            gui/ssa/gui_filters_advanced_logic.py \
            dev_env/streamlit_app.py

      - name: Focused pytest suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          uv run pytest -q \
            tests/test_cli_enhancement_manager_lock_usage.py \
            tests/test_import_cancellation.py \
            tests/test_database_optimized_identifier_guards.py \
            tests/test_gui_filters_advanced_logic.py \
            tests/test_streamlit_filter_cache.py
