name: minimal-ci

on:
  push:
    branches: [main, dev]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/minimal-ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/minimal-ci.yml"

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dev dependencies
        run: |
          set -euo pipefail
          uv sync --extra dev

      - name: Detect changed Python files
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ "$BASE_SHA" = "$ZERO_SHA" ]; then
            git ls-files "*.py" > .changed_python_files
          else
            git diff --name-only -z "$BASE_SHA" "${{ github.sha }}" -- "*.py" \
              | while IFS= read -r -d '' file_path; do
                  if [ -f "$file_path" ]; then
                    printf '%s\n' "$file_path"
                  fi
                done > .changed_python_files
          fi
          if [ ! -s .changed_python_files ]; then
            echo "No changed Python files detected for scoped static checks."
          else
            echo "Changed Python files:"
            cat .changed_python_files
          fi

      - name: Py compile changed Python paths
        run: |
          set -euo pipefail
          uv run --python 3.13 python - <<'PY'
from pathlib import Path
import py_compile

files_path = Path(".changed_python_files")
files = [line.strip() for line in files_path.read_text(encoding="utf-8").splitlines() if line.strip()]

if not files:
    print("No changed Python files to compile.")
else:
    for file_path in files:
        py_compile.compile(file_path, doraise=True)
PY

      - name: Ruff (changed files)
        run: |
          set -euo pipefail
          mapfile -t files < .changed_python_files
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Python files for Ruff."
          else
            uv run --python 3.13 ruff check "${files[@]}"
          fi

      - name: Ty (changed files)
        run: |
          set -euo pipefail
          mapfile -t files < .changed_python_files
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Python files for Ty."
          else
            uv run --python 3.13 ty check "${files[@]}"
          fi

      - name: Focused pytest suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          uv run --python 3.13 pytest -q tests
