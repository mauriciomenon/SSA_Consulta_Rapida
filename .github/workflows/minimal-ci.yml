name: minimal-ci

on:
  push:
    branches: [main, dev]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/minimal-ci.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/minimal-ci.yml"

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Sync dev dependencies
        run: |
          set -euo pipefail
          uv sync --extra dev

      - name: Py compile tracked Python paths
        run: |
          set -euo pipefail
          git ls-files -z "*.py" | xargs -0 uv run --python 3.13 python -m py_compile

      - name: Ruff
        run: |
          set -euo pipefail
          uv run --python 3.13 ruff check .

      - name: Ty
        run: |
          set -euo pipefail
          uv run --python 3.13 ty check .

      - name: Focused pytest suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          uv run --python 3.13 pytest -q tests
