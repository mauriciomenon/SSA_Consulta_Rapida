name: minimal-ci

on:
  push:
    branches: [main, dev]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/*.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/*.yml"

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  quality-gates:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: Install Qt runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get install -y libegl1 || {
            sudo apt-get update
            sudo apt-get install -y libegl1
          }

      - name: Sync dev dependencies
        run: |
          set -euo pipefail
          uv sync --extra dev

      - name: Detect changed Python files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO_SHA="0000000000000000000000000000000000000000"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            BASE_SHA="${PR_BASE_SHA}"
          else
            BASE_SHA="${BEFORE_SHA}"
          fi
          if [ "$BASE_SHA" = "$ZERO_SHA" ]; then
            git ls-files "*.py" > .changed_python_files
          else
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" -- "*.py" \
              | while IFS= read -r -d '' file_path; do
                  if [ -f "$file_path" ]; then
                    printf '%s\n' "$file_path"
                  fi
                done > .changed_python_files
          fi
          if [ ! -s .changed_python_files ]; then
            echo "No changed Python files detected for scoped static checks."
          else
            echo "Changed Python files:"
            cat .changed_python_files
          fi

      - name: Py compile changed Python paths
        run: |
          set -euo pipefail
          uv run --python 3.13 python - <<'PY'
          from pathlib import Path
          import py_compile

          files_path = Path(".changed_python_files")
          files = [line.strip() for line in files_path.read_text(encoding="utf-8").splitlines() if line.strip()]

          if not files:
              print("No changed Python files to compile.")
          else:
              for file_path in files:
                  py_compile.compile(file_path, doraise=True)
          PY

      - name: Ruff (changed files)
        run: |
          set -euo pipefail
          mapfile -t files < .changed_python_files
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Python files for Ruff."
          else
            uv run --python 3.13 ruff check "${files[@]}"
          fi

      - name: Ty (changed files)
        run: |
          set -euo pipefail
          mapfile -t files < .changed_python_files
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Python files for Ty."
          else
            uv run --python 3.13 ty check "${files[@]}"
          fi

      - name: Pytest suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          uv run --python 3.13 pytest -q tests
