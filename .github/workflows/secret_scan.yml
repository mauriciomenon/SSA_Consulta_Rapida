name: Secret Scan

on:
  push:
    branches: [main, dev]
  pull_request_target:
    branches: [main, dev]
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  secret-scan:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0  # required for PR and history scans

      - name: Select trusted secret scanner
        id: secret_scanner
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            trusted_root="${RUNNER_TEMP}/trusted-secret-scan"
            mkdir -p "$trusted_root"
            git cat-file -e "${BASE_SHA}^{commit}"
            trusted_paths=(scripts/security/scan_secrets.sh)
            if git cat-file -e "${BASE_SHA}:scripts/env/native_host_guard.sh" 2>/dev/null; then
              trusted_paths+=(scripts/env/native_host_guard.sh)
            fi
            git archive "$BASE_SHA" "${trusted_paths[@]}" | tar -x -C "$trusted_root"
            echo "script=${trusted_root}/scripts/security/scan_secrets.sh" >> "$GITHUB_OUTPUT"
          else
            echo "script=scripts/security/scan_secrets.sh" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout PR contents for scanning
        if: ${{ github.event_name == 'pull_request_target' }}
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
          [[ "$(git rev-parse FETCH_HEAD)" == "$HEAD_SHA" ]]
          git checkout --detach "$HEAD_SHA"

      - name: Filtered workspace scan
        run: bash "${{ steps.secret_scanner.outputs.script }}" workspace

      - name: PR diff scan
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash "${{ steps.secret_scanner.outputs.script }}" pr-diff "$BASE_SHA"

      - name: Advisory historic scan for legacy secrets
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        run: bash "${{ steps.secret_scanner.outputs.script }}" history
