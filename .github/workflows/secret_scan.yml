name: Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # precisamos do histórico para grep opcional

      - name: Quick working tree scan
        run: |
          set -euo pipefail
          echo '[INFO] Grep em arquivos (excluindo diretórios pesados)'
          PATTERN='sk-|hf_|API_KEY'
          ! grep -R -E "$PATTERN" . \
             --exclude-dir=launchers \
             --exclude-dir=.git \
             --exclude-dir=dist \
             --exclude-dir=build \
             --exclude-dir=logs \
             --exclude='*.pyc' \
             --exclude='*.so' \
             --exclude='check_banned_tokens.py' \
             --exclude='SECRET_HISTORY_REPORT.md' \
             --exclude='SESSION_CONTEXT_SNAPSHOT_*.md' \
             || (echo '[FAIL] Padrões sensíveis encontrados no working tree'; exit 1)

      - name: Staged-like diff scan (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          echo '[INFO] Escaneando diff da PR'
          git fetch origin ${{ github.base_ref }} --depth=1
          DIFF=$(git diff --unified=0 origin/${{ github.base_ref }}...HEAD || true)
          ADDITIONS=$(echo "$DIFF" | grep -E '^\+' | grep -vE '^\+\+\+')
          if echo "$ADDITIONS" | grep -E -q 'sk-|hf_|API_KEY'; then
            echo '[FAIL] Possível segredo introduzido no diff';
            exit 1;
          fi
          echo '[OK] Sem padrões sensíveis no diff'

      - name: Historic scan for legacy secrets (sample)
        run: |
          set -euo pipefail
          echo '[INFO] Amostragem de 50 commits para ver regressões'
          SAMPLE=$(git rev-list --max-count=50 HEAD)
          FOUND=0
          for c in $SAMPLE; do
            if git --no-pager grep -E 'sk-|hf_|API_KEY' $c >/dev/null 2>&1; then
              echo "[WARN] Padrão encontrado em commit $c (possível remanescente histórico).";
              FOUND=1
            fi
          done
          if [ $FOUND -eq 1 ]; then
            echo '[WARN] Achados históricos não necessariamente ativos (talvez já substituídos).'
          else
            echo '[OK] Amostra histórica limpa.'
          fi
