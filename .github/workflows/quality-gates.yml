name: Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies (runtime + tests)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e . || true
          pip install pytest || true

      - name: Run quality gates aggregator
        id: gates
        continue-on-error: true
        run: |
          echo "::group::Quality Gates"
          python scripts/run_quality_gates.py > quality_gates_output.jsonl 2>&1 || echo "GATES_FAILED"
          cat quality_gates_output.jsonl
          echo "::endgroup::"

          # Parse status from output
          if grep -q '"overall_status"' quality_gates_output.jsonl 2>/dev/null; then
            overall=$(python -c "import json,sys;from pathlib import Path; p=Path('quality_gates_output.jsonl'); lines=[l for l in p.read_text().splitlines() if l.strip()]; raw=lines[-1] if lines else '{}'; data=json.loads(raw); print(data.get('overall_status','error'))" 2>/dev/null || echo "error")
          else
            overall="error"
          fi
          echo "Overall status: $overall"
          echo "overall_status=$overall" >> "$GITHUB_OUTPUT"

      - name: Run smoke tests (-m smoke)
        id: smoke
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          # Ignora testes GUI que exigem libEGL em ambiente headless
          python -m pytest -m "smoke" -q \
            --ignore=tests/gui_poc_smoke_test.py \
            --ignore=tests/test_gui_filter_logic.py \
            --ignore=tests/test_gui_stability.py 2>&1 | tee smoke_output.txt

          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "smoke_status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "smoke_status=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate gate + smoke results
        run: |
          overall="${{ steps.gates.outputs.overall_status }}"
          smoke="${{ steps.smoke.outputs.smoke_status }}"

          echo "::notice::Overall gates: $overall | Smoke: $smoke"

          if [ "$overall" != "ok" ]; then
            echo "::warning::Quality gates reported issues ($overall)"
          fi
          if [ "$smoke" = "fail" ]; then
            echo "::warning::Smoke tests reported failures"
          fi

          # Allow workflow to pass with warnings
          exit 0

      # Comentado para ativação futura
      # - name: Ruff (planejado)
      #   run: ruff check . || true
      # - name: mypy (planejado)
      #   run: mypy core armazenamento || true

      - name: Upload gates raw output (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: quality-gates-output
          path: quality_gates_output.jsonl
          retention-days: 7
