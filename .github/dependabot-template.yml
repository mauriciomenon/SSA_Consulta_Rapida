version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    exclude-paths:
      - "launchers/platforms/**"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    reviewers:
      - "mauriciomenon"
    labels:
      - "dependencies"
      - "python"
