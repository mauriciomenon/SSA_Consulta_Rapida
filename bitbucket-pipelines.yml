image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim@sha256:531f855bda2c73cd6ef67d56b733b357cea384185b3022bd09f05e002cd144ca

clone:
  depth: 20

definitions:
  caches:
    uv: .uv-cache
  steps:
    - step: &quality-gates
        name: Python quality gates and smoke tests
        max-time: 45
        caches:
          - uv
        script:
          - export QT_QPA_PLATFORM=offscreen
          - export UV_CACHE_DIR="$BITBUCKET_CLONE_DIR/.uv-cache"
          - >-
            apt-get update && apt-get install --yes --no-install-recommends
            jq libdbus-1-3 libegl1 libfontconfig1 libgl1 libglib2.0-0 libopengl0
            libxkbcommon-x11-0 libxcb-cursor0
          - uv sync --frozen --extra dev
          - export PATH="$BITBUCKET_CLONE_DIR/.venv/bin:$PATH"
          - PYTHON="$BITBUCKET_CLONE_DIR/.venv/bin/python" bash scripts/ci_quality_gates.sh
    - step: &pytest-full
        name: Full Python test suite
        max-time: 60
        caches:
          - uv
        script:
          - export QT_QPA_PLATFORM=offscreen
          - export UV_CACHE_DIR="$BITBUCKET_CLONE_DIR/.uv-cache"
          - >-
            apt-get update && apt-get install --yes --no-install-recommends
            libdbus-1-3 libegl1 libfontconfig1 libgl1 libglib2.0-0 libopengl0
            libxkbcommon-x11-0 libxcb-cursor0
          - uv sync --frozen --extra dev
          - export PATH="$BITBUCKET_CLONE_DIR/.venv/bin:$PATH"
          - bash scripts/run_tests.sh

pipelines:
  custom:
    quality-gates:
      - step: *quality-gates
    pytest-full:
      - step: *pytest-full
