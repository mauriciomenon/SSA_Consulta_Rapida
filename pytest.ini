[pytest]
# Unificado (antes havia duas secoes duplicadas causando erro de configuracao)
testpaths = tests
norecursedirs = .git .tox .venv build dist *.egg launchers temp scripts
addopts = -vv -ra
log_cli = true
log_cli_level = INFO
log_cli_format = %(levelname)s: %(message)s
log_cli_date_format = %H:%M:%S
console_output_style = classic
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: testes que acessam multiplas camadas (db + scripts externos)
    legacy: testes herdados mantidos apenas como referencia historica
    slow: testes mais lentos (>2s) ou que dependem de IO pesado
    smoke: verificacao rapida de funcionalidades criticas
    performance: testes de performance / throughput de importacao
