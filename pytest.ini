[pytest]
# Unificado (antes havia duas seções duplicadas causando erro de configuração)
addopts = -vv -ra
log_cli = true
log_cli_level = INFO
log_cli_format = %(levelname)s %(name)s: %(message)s
log_cli_date_format = %H:%M:%S
console_output_style = classic
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: testes que acessam múltiplas camadas (db + scripts externos)
    legacy: testes herdados mantidos apenas como referência histórica
    slow: testes mais lentos (>2s) ou que dependem de IO pesado
    smoke: verificação rápida de funcionalidades críticas
    performance: testes de performance / throughput de importação
